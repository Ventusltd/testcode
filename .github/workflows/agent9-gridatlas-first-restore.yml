name: Agent9 isolated reference model, not product acceptance
on:
  pull_request:
    paths:
      - 'sandbox/gridatlas-agent9-first-restore/**'
      - '.github/workflows/agent9-gridatlas-first-restore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-reference-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Ventusltd/gridatlas
          ref: 4c52780c04a90608d8a072172138b9063e5a4684
          path: pinned-gridatlas
          sparse-checkout: |
            atlas/cartridges/202609241334-sld-sandbox-v9-8.js
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test sandbox/gridatlas-agent9-first-restore/state.test.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Ventusltd/globalgrid2050
          ref: 998c4cddbd78f04bcdd9df2a40026ac91714cd2f
          path: pinned-pipeline
          sparse-checkout: |
            uk_renewables_pipeline/202611151300/data/v9.1
          persist-credentials: false
      - name: Real pinned REPD source audit (NOT browser)
        run: node sandbox/gridatlas-agent9-first-restore/repd-static-audit.mjs pinned-pipeline/uk_renewables_pipeline/202611151300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent9-24-real-project-source-sample
          path: agent9-repd-receipts/static-audit.json
          if-no-files-found: warn
      - run: node sandbox/gridatlas-agent9-first-restore/mutation-selftest.mjs
      - run: node sandbox/gridatlas-agent9-first-restore/source-check.mjs pinned-gridatlas/atlas/cartridges/202609241334-sld-sandbox-v9-8.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent9-original-source
          path: agent9-original-source.json
          if-no-files-found: warn
