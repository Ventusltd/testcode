name: Recoverable Atlas tool composition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sandbox/202609060447/**'
      - 'sandbox/tools/*tool*'
      - 'sandbox/tools/polygon-boundaries.browser.cjs'
      - '.github/workflows/tool-recovery.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify host-only change and immutable dependencies
        run: node sandbox/tools/verify-tool-host-candidate.mjs 202609060447
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Exercise failure recovery, retained tool state and polygon boundaries
        run: |
          node sandbox/tools/candidate-server.cjs > candidate-server.log 2>&1 &
          node sandbox/tools/tool-recovery.browser.cjs http://127.0.0.1:8417/testcode/202609060447/atlas/
          node sandbox/tools/polygon-boundaries.browser.cjs http://127.0.0.1:8417/testcode/202609060447/atlas/
          node sandbox/tools/app-print.browser.cjs http://127.0.0.1:8417/testcode/202609060447/atlas/
      - name: Preserve full polygon interaction coverage
        env:
          CHROME_CHANNEL: chromium
          TEST_GENERATION: '202609060447'
          TEST_RESET: '1'
          TEST_DRAFT: '1'
          TEST_EXPORT: '1'
          TEST_IMPORT: '1'
          TEST_HISTORY: '1'
          TEST_LOCK: '1'
          TEST_FIT: '1'
          TEST_CSV: '1'
          TEST_COORDINATE: '1'
          TEST_VALIDITY: '1'
          TEST_REDRAW: '1'
          TEST_TOUCH: '1'
          TEST_KEYBOARD: '1'
          TEST_WINDING: '1'
          TEST_OUTPUT: poly-zone-artifacts
        run: node sandbox/tools/poly-zone.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recoverable-tools-${{ github.sha }}
          path: |
            tool-recovery-artifacts/
            polygon-boundaries-artifacts/
            app-print-artifacts/
            poly-zone-artifacts/
            candidate-server.log
          retention-days: 7
