name: Local review controller contract
on:
  push:
    branches: [codex/universe-review-20260914]
    paths: ['tools/local-gpu-review/**', '.github/workflows/local-review-controller.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/local-gpu-review/controller.test.mjs
