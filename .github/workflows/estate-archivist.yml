name: Estate Archivist offline tests

on:
  pull_request:
    paths:
      - tools/estate_archivist.py
      - tests/test_estate_archivist.py
      - .github/workflows/estate-archivist.yml
  push:
    branches: [v9.26-archivist]
    paths:
      - tools/estate_archivist.py
      - tests/test_estate_archivist.py
      - .github/workflows/estate-archivist.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-archivist-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-history-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic Git-history regressions, no estate acquisition
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import unittest
          assert Path('tools/estate_archivist.py').is_file(), 'utility missing'
          assert Path('tests/test_estate_archivist.py').is_file(), 'tests missing'
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_estate_archivist.py')
          assert suite.countTestCases() >= 7, 'expected at least seven history regressions'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
