name: Estate Archivist offline tests

on:
  pull_request:
    paths:
      - tools/estate_archivist.py
      - tests/test_estate_archivist.py
      - .github/workflows/estate-archivist.yml
  push:
    branches: [v9.26-archivist]
    paths:
      - tools/estate_archivist.py
      - tests/test_estate_archivist.py
      - .github/workflows/estate-archivist.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-archivist-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-history-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic Git-history regressions, no estate acquisition
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: python -B -m unittest discover -s tests -p test_estate_archivist.py -v
