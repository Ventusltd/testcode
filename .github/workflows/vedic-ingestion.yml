name: VEDIC incremental ingestion contracts
on:
  pull_request:
    paths:
      - 'sandbox/vedic-ingestion/**'
      - '.github/workflows/vedic-ingestion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate read-only incremental catalogue
        run: python -m unittest discover -s sandbox/vedic-ingestion -p 'test_*.py' -v
