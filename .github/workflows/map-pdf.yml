name: Native map PDF outcomes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sandbox/202609060418/**'
      - 'sandbox/tools/*pdf*'
      - 'sandbox/tools/candidate-server.cjs'
      - 'sandbox/tools/browser-webgl-probe.mjs'
      - '.github/workflows/map-pdf.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Ventusltd/gridatlas
          ref: 6d77a92688c07363f8c99c1e1cba7f54d4a039f0
          fetch-depth: 0
          path: owner-gridatlas
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify source and native PDF writer
        env:
          GRIDATLAS_REPO: owner-gridatlas
        run: |
          node sandbox/tools/verify-poly-candidate.mjs 202609060418
          node --test owner-gridatlas/tools/proofs/map-pdf.test.mjs
      - name: Install pinned browser and independent PDF tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium firefox webkit
          python -m pip install PyMuPDF==1.28.2
      - name: Download actual PDFs in three browser engines
        env:
          TEST_OUTPUT: pdf-artifacts
          FIREFOX_HEADED: '1'
        run: |
          node sandbox/tools/candidate-server.cjs > candidate-server.log 2>&1 &
          xvfb-run --auto-servernum node sandbox/tools/browser-webgl-probe.mjs
          xvfb-run --auto-servernum node sandbox/tools/pdf-export.browser.mjs http://127.0.0.1:8417/testcode/202609060418/atlas/
          python sandbox/tools/pdf-render-check.py pdf-artifacts 202609060418
      - name: Retain complete polygon interaction coverage
        env:
          CHROME_CHANNEL: chromium
          TEST_GENERATION: '202609060418'
          TEST_RESET: '1'
          TEST_DRAFT: '1'
          TEST_EXPORT: '1'
          TEST_IMPORT: '1'
          TEST_HISTORY: '1'
          TEST_LOCK: '1'
          TEST_FIT: '1'
          TEST_CSV: '1'
          TEST_COORDINATE: '1'
          TEST_VALIDITY: '1'
          TEST_REDRAW: '1'
          TEST_TOUCH: '1'
          TEST_OUTPUT: poly-zone-artifacts
        run: node sandbox/tools/poly-zone.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pdf-${{ github.sha }}
          path: |
            pdf-artifacts/
            poly-zone-artifacts/
            candidate-server.log
          retention-days: 7
