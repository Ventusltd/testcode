name: Galaxy lab browser verification
on:
  push:
    branches: [main]
    paths:
      - 'sandbox/*-galaxy-visibility/**'
      - 'sandbox/*-galaxy-demand/**'
      - 'sandbox/*-galaxy-hops/**'
      - '.github/workflows/galaxy-lab-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galaxy-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            sandbox/*-galaxy-visibility/**
            sandbox/*-galaxy-demand/**
            sandbox/*-galaxy-hops/**
            .github/workflows/galaxy-lab-verify.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install bounded browser test dependency
        working-directory: ${{ runner.temp }}
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock playwright@1.62.1
      - name: Install browser engines
        working-directory: ${{ runner.temp }}
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Verify changed immutable labs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/node_modules/playwright/index.mjs
        shell: python
        run: |
          import os, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          before = os.environ.get('BEFORE_SHA', '')
          changed = []
          if os.environ['EVENT_NAME'] == 'push' and re.fullmatch('[0-9a-f]{40}', before) and set(before) != {'0'}:
              changed = subprocess.check_output(['git', 'diff', '--name-only', before, os.environ['GITHUB_SHA']], text=True).splitlines()
          all_versions = not changed or '.github/workflows/galaxy-lab-verify.yml' in changed
          supported = re.compile(r'^sandbox/[0-9]{12}-galaxy-(visibility|demand|hops)/')
          versions = sorted({p.parent for p in root.glob('sandbox/*/browser-check.mjs') if supported.match(p.relative_to(root).as_posix())} if all_versions else {root.joinpath(*p.split('/')[:2]) for p in changed if supported.match(p)})
          if not versions:
              raise SystemExit('No supported lab selected')
          for version in versions:
              subprocess.run(['node', '--test', 'model.test.mjs'], cwd=version, check=True, timeout=90)
              env = dict(os.environ, PROOF_OUTPUT=str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'galaxy-lab-evidence' / version.name))
              subprocess.run(['node', 'browser-check.mjs'], cwd=version, env=env, check=True, timeout=180)
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: galaxy-lab-${{ github.sha }}
          path: ${{ runner.temp }}/galaxy-lab-evidence
          retention-days: 7
          if-no-files-found: warn
